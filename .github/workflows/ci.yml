# Run the existing host checks and build only the iPhone RootHide package.
# Publish that same artifact from test only after both jobs succeed.
name: CI

on:
  push:
    branches:
      - main-4.0
      - test
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

# A pull request's new push cancels the run of its old one. A push to
# main-4.0 keeps its own run however soon the next one follows, since a tag
# on that commit publishes what the run built.
concurrency:
  group: irisin-${{ github.workflow }}-${{ github.event_name == 'pull_request' && github.ref || github.sha }}
  cancel-in-progress: true

env:
  HOMEBREW_NO_AUTO_UPDATE: "1"
  HOMEBREW_NO_INSTALL_CLEANUP: "1"
  HOMEBREW_NO_ANALYTICS: "1"

jobs:
  # Minutes where the build takes the better part of an hour, so a broken
  # test says so long before the packages would. Host only: `swift build`
  # has no flat Products directory and needs no case-sensitive volume.
  test:
    name: Host tests
    runs-on: macos-26
    timeout-minutes: 60

    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Select newest Xcode
        run: |
          latest="$(find /Applications -maxdepth 1 -type d -name 'Xcode*.app' -print | sort -V | tail -n1)"
          sudo xcode-select -s "$latest/Contents/Developer"
          xcodebuild -version

      # zstd is beyond the system's tar: what reads a repacked package here,
      # beside our own libarchive, is dpkg-deb.
      - name: Install dpkg
        run: command -v dpkg-deb >/dev/null 2>&1 || brew install dpkg

      - name: Run host tests
        run: make harness

  # The device packages link the iOS 27.1 SDK (the Makefile refuses an
  # older one): built with it, the app fills an iPhone Duo's displays and
  # its bars stand on the side. The macos-26 images stop at Xcode 26; the
  # xcode-27 runner has Xcode 27.1, chosen by name below rather than as the
  # newest, which on that image is a 27.2 release candidate.
  build:
    name: Build and verify iphoneos-arm64e
    runs-on: xcode-27
    timeout-minutes: 90
    outputs:
      artifact-id: ${{ steps.package.outputs.artifact-id }}
      artifact-digest: ${{ steps.package.outputs.artifact-digest }}

    steps:
      - name: Configure build paths
        shell: bash
        run: |
          set -euo pipefail
          echo "DERIVED_DATA=$RUNNER_TEMP/irisin-$GITHUB_RUN_ID-$GITHUB_RUN_ATTEMPT" >> "$GITHUB_ENV"

      - name: Check out repository
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Select Xcode 27.1
        run: |
          sudo xcode-select -s /Applications/Xcode_27.1.app/Contents/Developer
          xcodebuild -version
          echo "iPhoneOS SDK $(xcrun --sdk iphoneos --show-sdk-version)"

      - name: Install packaging dependencies
        shell: bash
        run: |
          set -euo pipefail
          formulae=()
          command -v dpkg-deb >/dev/null 2>&1 || formulae+=(dpkg)
          command -v ldid >/dev/null 2>&1 || formulae+=(ldid)
          if (( ${#formulae[@]} > 0 )); then
            brew install "${formulae[@]}"
          fi

      - name: Compile
        run: make compile CONFIGURATION=Release DERIVED_DATA="$DERIVED_DATA" BUILD_NUMBER="$GITHUB_RUN_NUMBER"

      - name: Package and verify RootHide arm64e
        run: make _package-deb FLAVOR=roothide CONFIGURATION=Release DERIVED_DATA="$DERIVED_DATA" BUILD_NUMBER="$GITHUB_RUN_NUMBER"

      - name: Require exactly one arm64e package
        shell: bash
        run: |
          set -euo pipefail
          packages=(build/Packages/*.deb)
          [[ ${#packages[@]} -eq 1 && -f "${packages[0]}" && "${packages[0]}" == *_iphoneos-arm64e.deb ]]
          shasum -a 256 "${packages[0]}"

      - name: Upload RootHide arm64e package
        id: package
        uses: actions/upload-artifact@v4
        with:
          name: irisin-${{ github.sha }}
          path: build/Packages/*_iphoneos-arm64e.deb
          if-no-files-found: error
          retention-days: 30

  publish:
    name: Publish verified RootHide package
    needs: [test, build]
    if: >-
      github.repository == 'wm0104/irisin' && github.ref == 'refs/heads/test' &&
      (github.event_name == 'push' || github.event_name == 'workflow_dispatch')
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write
      actions: read
    concurrency:
      group: irisin-release-${{ github.repository }}
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - name: Publish this run's verified package
        env:
          GH_TOKEN: ${{ github.token }}
          ARTIFACT_ID: ${{ needs.build.outputs.artifact-id }}
          ARTIFACT_DIGEST: ${{ needs.build.outputs.artifact-digest }}
        shell: bash
        run: python3 Scripts/publish-release.py
      - name: Retain release metadata evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: irisin-release-evidence-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/irisin-release-evidence/*.json
          if-no-files-found: ignore
          retention-days: 30
